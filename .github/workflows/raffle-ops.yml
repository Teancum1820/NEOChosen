name: Raffle operations rehearsal

on:
  pull_request:
    paths:
      - 'scripts/raffle_ops.py'
      - 'tests/test_raffle_ops.py'
      - 'docs/raffle-*'
      - 'docs/raffle-samples/**'
      - '.github/workflows/raffle-ops.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offline reconciliation and schedule boundaries
        run: python -m unittest discover -s tests -p test_raffle_ops.py -v
